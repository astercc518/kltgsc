name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tgsc_ci
          POSTGRES_PASSWORD: tgsc_ci_password
          POSTGRES_DB: tgsc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tgsc_ci -d tgsc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite://
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-at-least-32-characters
      SESSION_ENCRYPTION_KEY: ci-test-session-key-at-least-32-characters
      ADMIN_PASSWORD: ci-test-admin-password
      SECURITY_ENABLED: "true"
      LLM_SAFETY_WARMUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify test collection
        working-directory: backend
        run: pytest --collect-only -q
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
      - name: Require one Alembic head
        working-directory: backend
        run: test "$(alembic heads | grep -c '(head)$')" -eq 1
      - name: Upgrade a clean PostgreSQL database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://tgsc_ci:tgsc_ci_password@localhost:5432/tgsc_ci
        run: alembic upgrade head
      - name: Scan tracked files for credentials
        run: scripts/check_tracked_secrets.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install locked dependencies
        working-directory: landing
        run: npm ci
      - name: Typecheck
        working-directory: landing
        run: npm run typecheck
      - name: Test
        working-directory: landing
        run: npm test -- --run
      - name: Build
        working-directory: landing
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing/dist

  release-contract:
    runs-on: ubuntu-latest
    needs: [backend, frontend, landing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: landing-dist
          path: landing/dist
      - name: Require release inputs
        run: |
          test -f landing/dist/index.html
          test -f frontend/src/lib/queryClient.ts
          test -f scripts/release_preflight.sh
          test -f backend/.env.example
      - name: Prepare placeholder Compose environment
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env -f docker-compose.yml config -q
          docker compose --env-file .env -f docker-compose.prod.yml config -q
