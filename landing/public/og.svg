<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0066FF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="200" cy="500" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0066FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="1000" cy="150" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background + glows -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-blue)"/>
  <rect width="1200" height="630" fill="url(#glow-purple)"/>

  <!-- Brand mark + wordmark -->
  <g transform="translate(80,80)">
    <rect width="56" height="56" rx="13" fill="url(#brand)"/>
    <path d="M12 30L43 14l-9 27-10-10-3 7z" fill="white" fill-opacity="0.95"/>
    <text x="74" y="38"
          font-family="Manrope, system-ui, sans-serif"
          font-size="34" font-weight="700" fill="white">TG1<tspan fill="#A855F7">.AI</tspan></text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="230"
        font-family="ui-monospace, JetBrains Mono, monospace"
        font-size="20" font-weight="500" letter-spacing="3" fill="#94A3B8">
    TELEGRAM GROWTH, ON AUTOPILOT
  </text>

  <!-- Big headline -->
  <text x="80" y="310"
        font-family="Manrope, system-ui, sans-serif"
        font-size="78" font-weight="700" fill="white" letter-spacing="-2">
    Two ways to grow
  </text>
  <text x="80" y="395"
        font-family="Manrope, system-ui, sans-serif"
        font-size="78" font-weight="700" letter-spacing="-2" fill="url(#brand)">
    on Telegram.
  </text>

  <!-- Sub -->
  <text x="80" y="460"
        font-family="Inter, system-ui, sans-serif"
        font-size="26" fill="#CBD5E1">
    Pay-as-you-go bulk ops + an AI marketing assistant.
  </text>
  <text x="80" y="495"
        font-family="Inter, system-ui, sans-serif"
        font-size="26" fill="#94A3B8">
    USDT billing. 1000+ accounts per tenant.
  </text>

  <!-- Bottom CTA hint bar -->
  <g transform="translate(80,560)">
    <rect width="320" height="50" rx="25" fill="#0066FF"/>
    <text x="160" y="32"
          text-anchor="middle"
          font-family="Inter, system-ui, sans-serif"
          font-size="20" font-weight="600" fill="white">
      Free $20 Trial
    </text>
    <text x="430" y="32"
          font-family="ui-monospace, JetBrains Mono, monospace"
          font-size="18" fill="#94A3B8">
      tg1.ai
    </text>
  </g>

  <!-- Subtle dot grid bottom-right for texture -->
  <g fill="#1E293B" opacity="0.5">
    <circle cx="1100" cy="500" r="2"/>
    <circle cx="1120" cy="500" r="2"/>
    <circle cx="1140" cy="500" r="2"/>
    <circle cx="1100" cy="520" r="2"/>
    <circle cx="1120" cy="520" r="2"/>
    <circle cx="1140" cy="520" r="2"/>
    <circle cx="1100" cy="540" r="2"/>
    <circle cx="1120" cy="540" r="2"/>
    <circle cx="1140" cy="540" r="2"/>
  </g>
</svg>
